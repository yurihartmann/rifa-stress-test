# Dokploy Compose service. See deploy/DOKPLOY.md.
# No host ports: Traefik reaches container ports on the compose network.
# Name the Dokploy Compose application `rifa` so Alloy's project filter matches
# (Dokploy runs `docker compose -p <appName>` and overrides `name`).

name: rifa

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rifa}
      POSTGRES_USER: ${POSTGRES_USER:-rifa}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}"
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - work_mem=4MB
      - -c
      - max_connections=80
      - -c
      - wal_buffers=16MB
      - -c
      - max_wal_size=1GB
      - -c
      - checkpoint_timeout=10min
    shm_size: 128mb
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rifa} -d ${POSTGRES_DB:-rifa}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 2G

  migrate:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: rifa-api:local
    pull_policy: build
    command: ["/migrate"]
    restart: "no"
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-rifa}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rifa}?sslmode=disable"
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      ORDER_HOLD_TTL: 15m
      GOMAXPROCS: "1"
      GOMEMLIMIT: 450MiB
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: rifa-api
    depends_on:
      postgres:
        condition: service_healthy
      otel-collector:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: rifa-api:local
    pull_policy: build
    command: ["/api"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-rifa}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rifa}?sslmode=disable"
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      ORDER_HOLD_TTL: 15m
      GOMAXPROCS: "1"
      GOMEMLIMIT: 450MiB
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      HTTP_ADDR: ":8080"
      OTEL_SERVICE_NAME: rifa-api
    expose:
      - "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8080/health || curl -fsS -o /dev/null http://127.0.0.1:8080/health",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  worker:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    image: rifa-api:local
    pull_policy: build
    command: ["/worker"]
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-rifa}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-rifa}?sslmode=disable"
      PAYMENT_WEBHOOK_SECRET: "${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET is required}"
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN is required}"
      ORDER_HOLD_TTL: 15m
      GOMAXPROCS: "1"
      GOMEMLIMIT: 450MiB
      OTEL_EXPORTER_OTLP_ENDPOINT: otel-collector:4317
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_INSECURE: "true"
      OTEL_SERVICE_NAME: rifa-worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
      args:
        # "/" is same-origin. nginx in the image proxies /v1 to the api service.
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-/}"
    image: rifa-web:local
    pull_policy: build
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_started

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.123.0
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      tempo:
        condition: service_started

  tempo:
    image: grafana/tempo:2.7.2
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo/config.yaml:/etc/tempo/config.yaml:ro
      - tempo-data:/var/tempo

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    user: "0:0"
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    user: "0:0"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=24h
      - --storage.tsdb.retention.size=1GB
      - --storage.tsdb.out-of-order-time-window=30m
      - --web.enable-remote-write-receiver
      - --web.listen-address=:9090
    expose:
      - "9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      otel-collector:
        condition: service_started

  alloy:
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    user: "0:0"
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      loki:
        condition: service_started
      api:
        condition: service_started
      worker:
        condition: service_started

  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "${GF_AUTH_ANONYMOUS_ENABLED:-false}"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_USER: "${GF_SECURITY_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:?GF_SECURITY_ADMIN_PASSWORD is required}"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_started
      loki:
        condition: service_started
      tempo:
        condition: service_started

volumes:
  postgres-data:
  loki-data:
  tempo-data:
  prometheus-data:
  alloy-data:
